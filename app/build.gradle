plugins { id 'com.android.application' }
android {
    namespace 'ru.ivan.pingvin'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.ivan.pingvin'
        minSdk 26
        targetSdk 28
        versionCode 16
        versionName "1.15"
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        release {
            def ks = project.findProperty('PINGVIN_KEYSTORE')
            def pf = project.findProperty('PINGVIN_KEYSTORE_PASSWORD_FILE')
            if (ks && pf) {
                storeFile file(ks)
                def pw = new File(pf.toString()).getText('UTF-8').trim()
                storePassword pw
                keyAlias 'pingvin'
                keyPassword pw
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (project.findProperty('PINGVIN_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    aaptOptions { noCompress 'apk', 'xz', 'tar' }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'com.github.termux.termux-app:terminal-view:v0.118.1'
    implementation 'com.github.termux.termux-app:terminal-emulator:v0.118.1'
    implementation 'com.android.tools.build:apksig:8.7.3'
    implementation 'org.tukaani:xz:1.10'
    implementation 'androidx.core:core:1.13.1'
}
